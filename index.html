<div class="clamo-grid">
  <button class="clamo-pill" onclick="injectPrompt('Vice caché après achat VO')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v4l2.5 2.5"/></svg>
    Vice caché VO
  </button>
  <button class="clamo-pill" onclick="injectPrompt('Défaut de conformité véhicule neuf')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="20 6 9 17 4 12"/></svg>
    Non-conformité VN
  </button>
  <button class="clamo-pill" onclick="injectPrompt('Sinistre antérieur dissimulé par le vendeur')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
    Sinistre caché
  </button>
  <button class="clamo-pill" onclick="injectPrompt('Vendeur qui refuse de répondre à ma réclamation')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
    Vendeur silencieux
  </button>
  <button class="clamo-pill" onclick="injectPrompt('Kilométrage trafiqué sur mon véhicule')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
    Kilométrage falsifié
  </button>
  <button class="clamo-pill" onclick="injectPrompt('Panne répétitive non résolue sous garantie')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 00-4 0v2"/><line x1="12" y1="12" x2="12" y2="16"/></svg>
    Panne récurrente
  </button>
  <button class="clamo-pill" onclick="injectPrompt('J\'ai une protection juridique, mon assurance peut couvrir les frais')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
    Protection juridique
  </button>
  <button class="clamo-pill" onclick="injectPrompt('Je souhaite une expertise automobile agréée pour mon dossier')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    Expertise auto
  </button>
</div>

<div class="clamo-bar">
  <input id="clamoInput" type="text"
    placeholder="Décrivez votre litige auto — on s'assure de faire valoir vos droits">
  <div class="clamo-bar-btns">
    <button class="btn-joindre" onclick="document.getElementById('clamoFile').click()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48"/></svg>
      <span>Joindre</span>
    </button>
    <input type="file" id="clamoFile" multiple style="display:none"
      accept=".pdf,.jpg,.jpeg,.png,.docx,.doc">
    <button class="btn-envoyer" onclick="clamoSend()">
      Envoyer
      <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
    </button>
  </div>
</div>
